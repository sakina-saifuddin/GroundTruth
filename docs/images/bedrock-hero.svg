  <path d="M0 225 Q190 193 390 229 T780 221 T1200 230 V330 H0Z" fill="#9c674b"/>
  <path d="M0 300 Q160 276 350 306 T720 300 T1200 306 V420 H0Z" fill="#68483a"/>
